<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Importing Poppins font for a clean, modern UI look -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/style.css" />
    <title>Landing Launchpad</title>
    <script
      src="https://kit.fontawesome.com/3c89c134d4.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header class="hero-section">
      <!-- Background Overlay for the pattern/grid effect -->
      <div class="background-pattern"></div>
      <nav class="navbar">
        <div class="logo">LOGO</div>
        <a href="#" class="btn btn-primary">Sign Up</a>
      </nav>
      <div class="hero-content">
        <h1>Cool Dark UI Template for<br />Webflow Agencies!</h1>
        <a href="#" class="btn btn-primary btn-large">Stay Focused</a>
      </div>
    </header>

    <main>
      <section class="action-section">
        <div class="action-container">
          <!-- Left Side: Text Content -->
          <div class="action-text">
            <h2>See It in Action</h2>
            <p>
              Explore the live preview and imagine your brand in this bold new
              look.
            </p>
            <a href="#" class="btn btn-primary btn-large"
              >Launch Live Preview</a
            >
          </div>
          <!-- Right Side: The Image -->
          <div class="action-image">
            <img src="images/wc-mini.png" alt="Preview screenshot" />
          </div>
        </div>
      </section>
    </main>

    <footer></footer>
  </body>
</html>
